; Build with PlatformIO (VS Code): open THIS folder, then Build / Upload / Monitor.
; Also builds with plain ESP-IDF:  idf.py set-target esp32s3 build flash monitor
[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 115200
